name: Build verified quotes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 2,000 verified quotes
        run: node scripts/build-quotes.mjs

      - name: Audit quote dataset
        run: node scripts/audit-quotes.mjs

      - name: Commit generated dataset
        run: |
          if git diff --quiet -- data/quotes.json; then
            echo "data/quotes.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          git commit -m "data: publish 2000 verified quotes"
          git push
