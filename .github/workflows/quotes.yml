name: Build verified quotes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-wikisource-quotes.mjs'
      - '.github/workflows/quotes.yml'
      - 'package.json'
permissions:
  contents: write
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-wikisource-quotes.mjs
      - run: node -e "const q=require('./data/quotes.json'); if(q.length!==2000) process.exit(1); if(q.some(x=>!x.indexable||x.copyrightStatus!=='public-domain-source'||x.attributionStatus!=='source-attributed')) process.exit(1); console.log('Verified indexable quotes:',q.length)"
      - uses: EndBug/add-and-commit@v9
        with:
          add: 'data/quotes.json'
          message: 'data: add 2000 verified public-domain quotes'
