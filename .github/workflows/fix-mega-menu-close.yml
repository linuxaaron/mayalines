name: Fix Mega Menu Close

on:
  push:
    paths:
      - '.github/workflows/fix-mega-menu-close.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Shorten desktop menu close delay
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/MegaMenu.tsx')
          text = path.read_text()
          old = 'const MENU_CLOSE_DELAY = 4500;'
          new = 'const MENU_CLOSE_DELAY = 650;'
          if old not in text and new not in text:
              raise SystemExit('Expected MENU_CLOSE_DELAY constant not found')
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- components/MegaMenu.tsx; then
            echo "Mega menu already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/MegaMenu.tsx
          git commit -m "Fix mega menu auto-close after mouse leave"
          git push
