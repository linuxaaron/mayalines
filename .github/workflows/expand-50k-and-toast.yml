name: Expand Quote Corpus and Result Toast

on:
  push:
    paths:
      - ".github/workflows/expand-50k-and-toast.yml"

permissions:
  contents: write

concurrency:
  group: mayalines-50k-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch corpus target, category quality and UI toast
        run: |
          python - <<'PY'
          from pathlib import Path

          # Quote corpus builder
          p = Path("scripts/build-quotes.mjs")
          s = p.read_text()
          s = s.replace('const PUBLISH_TARGET = 12000;', 'const PUBLISH_TARGET = 49000;')
          s = s.replace('const MIN_REQUIRED_COUNT = 10000;', 'const MIN_REQUIRED_COUNT = 47000;')
          s = s.replace('MayalinesQuoteBuilder/4.3', 'MayalinesQuoteBuilder/5.0')

          if 'const PUBLIC_DOMAIN_ARCHIVE =' not in s:
              anchor = 'const WIKISOURCE = {'
              block = '''const PUBLIC_DOMAIN_ARCHIVE = {\n  commit: "dea847392de0d4a36c632d410b73587e4987852b",\n  url: "https://raw.githubusercontent.com/ConceptJunkie/quote/dea847392de0d4a36c632d410b73587e4987852b/quote.txt",\n  name: "ConceptJunkie quote archive — curated public-domain collection",\n};\n\n'''
              s = s.replace(anchor, block + anchor, 1)

          old_norm = 'function normalizeCategory(value) { const normalized = titleCase(clean(value).replace(/[.:]+$/, "")); return CATEGORY_ALIASES.get(normalized) || normalized || "Wisdom"; }'
          new_norm = '''const CORE_CATEGORIES = new Set(["Art","Character","Courage","Education","Faith","Freedom","Friendship","Happiness","Hope","Life","Love","Motivation","Nature","Philosophy","Science","Success","Truth","Wisdom"]);\nfunction normalizeCategory(value, quoteText = "") {\n  const normalized = titleCase(clean(value).replace(/[.:]+$/, ""));\n  const mapped = CATEGORY_ALIASES.get(normalized) || normalized;\n  return CORE_CATEGORIES.has(mapped) ? mapped : categoryFor(quoteText || normalized);\n}'''
          if old_norm in s:
              s = s.replace(old_norm, new_norm, 1)
          s = s.replace('category: normalizeCategory(category), language, source,', 'category: normalizeCategory(category, quote), language, source,', 1)

          fallback_anchor = 'if (quotes.length < MIN_REQUIRED_COUNT) throw new Error(`Quote build produced ${quotes.length} records; at least ${MIN_REQUIRED_COUNT} concrete quotes are required.`);'
          if 'PUBLIC_DOMAIN_ARCHIVE.url' not in s[s.find('for (const source of GUTENBERG_SOURCES)'):]:
              fallback = r'''if (quotes.length < PUBLISH_TARGET) {
  const archiveText = await fetchText(PUBLIC_DOMAIN_ARCHIVE.url);
  if (archiveText) {
    const blocks = archiveText.replace(/\r/g, "").split(/\n%\n/);
    for (const block of blocks) {
      if (quotes.length >= PUBLISH_TARGET) break;
      const lines = block.split("\n").map((line) => clean(line)).filter(Boolean);
      if (lines.length < 2) continue;
      const last = lines.at(-1) ?? "";
      const match = last.match(/^(?:--|—|-)\s*(.{2,120})$/);
      if (!match) continue;
      const author = clean(match[1]);
      const quote = clean(lines.slice(0, -1).join(" "));
      addQuote({
        quote,
        author,
        category: categoryFor(quote),
        source: PUBLIC_DOMAIN_ARCHIVE.url,
        sourceName: PUBLIC_DOMAIN_ARCHIVE.name,
        sourceCommit: PUBLIC_DOMAIN_ARCHIVE.commit,
        language: "en",
        attributionStatus: "source-derived",
        copyrightStatus: "needs-review",
        indexable: true,
      });
    }
  }
}

'''
              s = s.replace(fallback_anchor, fallback + fallback_anchor, 1)
          p.write_text(s)

          # Materialization workflow thresholds/messages
          p = Path(".github/workflows/materialize-quotes.yml")
          s = p.read_text()
          s = s.replace('MIN_QUOTES=10000 MAX_QUOTES=59000', 'MIN_QUOTES=47000 MAX_QUOTES=59000')
          s = s.replace('data: materialize 12000 sourced quotes', 'data: materialize up to 49000 sourced quotes')
          p.write_text(s)

          # Home library: centered transient result-count toast.
          p = Path("components/HomeQuoteLibrary.tsx")
          s = p.read_text()
          s = s.replace('  const firstRun = useRef(true);', '  const firstRun = useRef(true);\n  const toastTimer = useRef<ReturnType<typeof setTimeout> | null>(null);\n  const [resultToast, setResultToast] = useState<number | null>(null);')
          s = s.replace('      setTotal(data.total);\n      setHasMore(data.hasMore);', '''      setTotal(data.total);
      setHasMore(data.hasMore);
      if (reset) {
        setResultToast(data.total);
        if (toastTimer.current) window.clearTimeout(toastTimer.current);
        toastTimer.current = window.setTimeout(() => {
          setResultToast(null);
          toastTimer.current = null;
        }, 1450);
      }''')
          s = s.replace('  useEffect(() => {\n    if (firstRun.current)', '''  useEffect(() => () => {
    if (toastTimer.current) window.clearTimeout(toastTimer.current);
  }, []);

  useEffect(() => {
    if (firstRun.current)''')
          s = s.replace('      <p className="library-meta" aria-live="polite">{total.toLocaleString("en-US")} quotes</p>', '<p className="sr-only" aria-live="polite">{total.toLocaleString("en-US")} quotes</p>')
          s = s.replace('  return <>\n    <section className="hero"', '''  return <>
    <style>{`
      .quote-count-toast{position:fixed;z-index:500;left:50%;top:50%;transform:translate(-50%,-50%);min-width:150px;padding:15px 22px;border-radius:10px;background:#090909;color:#fff;text-align:center;font-size:18px;font-weight:800;letter-spacing:.01em;box-shadow:0 18px 52px rgba(0,0,0,.28);pointer-events:none;animation:quote-count-toast 1.45s ease both}
      @keyframes quote-count-toast{0%{opacity:0;transform:translate(-50%,-44%) scale(.96)}12%,76%{opacity:.96;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-56%) scale(.98)}}
      @media(max-width:560px){.quote-count-toast{min-width:128px;padding:13px 18px;font-size:16px}}
      @media(prefers-reduced-motion:reduce){.quote-count-toast{animation:none}}
    `}</style>
    {resultToast !== null && <div className="quote-count-toast" role="status" aria-live="polite">{resultToast.toLocaleString("en-US")} quotes</div>}
    <section className="hero"''')
          p.write_text(s)
          PY

      - name: Build 49k sourced quote corpus
        run: node scripts/build-quotes.mjs

      - name: Audit quote corpus
        run: MIN_QUOTES=47000 MAX_QUOTES=59000 node scripts/audit-quotes.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified migration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/expand-50k-and-toast.yml
          git add scripts/build-quotes.mjs .github/workflows/materialize-quotes.yml components/HomeQuoteLibrary.tsx data/quotes.json data/poems.generated.json
          git commit -m "Expand quote library toward 50k and improve filter feedback"
          git push
